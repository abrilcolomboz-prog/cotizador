<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COTIZADOR POCAMARKET</title>
    <!-- Importamos la fuente Montserrat desde Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* Estilos Globales */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            /* Fondo Rosa Pastel */
            background-color: #FFD1DC; 
            /* Diseño sutil de estrellas blancas usando SVG */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60"><path d="M15 5l1.2 2.5 2.8.4-2 2 1.3 2.6-2.3-1.5-2.3 1.5 1.3-2.6-2-2 2.8-.4L15 5zm30 30l.8 1.7 1.9.3-1.4 1.3.9 1.8-1.6-1-1.6 1 .9-1.8-1.4-1.3 1.9-.3.8-1.7zm5-20l.5 1 .9.2-.7.7.4 1-.8-.5-.8.5.4-1-.7-.7.9-.2.5-1z" fill="%23FFFFFF" fill-opacity="0.5"/></svg>');
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Contenedor del Cotizador (Contained) */
        .cotizador-container {
            background-color: #ffffff; /* Blanco puro */
            max-width: 450px;
            width: 100%;
            padding: 35px 30px;
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(255, 182, 193, 0.4); /* Sombra rosa suave */
            border: 1px solid rgba(255, 255, 255, 0.7);
            text-align: center;
        }

        /* Título en Montserrat Negrita */
        h1 {
            font-size: 24px;
            color: #111827;
            font-weight: 700; /* Negrita */
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        /* Subtítulo en Montserrat Negro */
        .subtitulo {
            font-size: 14px;
            color: #000000; /* Color negro */
            font-weight: 500;
            margin-bottom: 28px;
        }

        /* Bloque del único Input */
        .input-group {
            margin-bottom: 28px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #ff8fa3; /* Rosa oscuro estético para el label */
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        input[type="number"] {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 2px solid #ffe4e1; /* Rosa muy pálido */
            border-radius: 12px;
            outline: none;
            transition: all 0.2s ease;
            color: #333333;
            background-color: #fffafb;
        }

        input[type="number"]:focus {
            border-color: #ffb6c1;
            box-shadow: 0 0 0 4px rgba(255, 182, 193, 0.3);
            background-color: #ffffff;
        }

        /* Sección de Resultados */
        .resultados-box {
            background-color: #fff5f6; /* Fondo rosa ultra claro */
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 10px;
            border: 1px dashed #ffccd5;
        }

        .resultado-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
        }

        .resultado-item:first-child {
            border-bottom: 1px solid #ffe4e1;
        }

        .res-label {
            font-size: 13px;
            color: #666666;
            font-weight: 500;
            text-align: left;
        }

        .res-value {
            font-size: 18px;
            color: #ff758f; /* Rosa destacado para el precio */
            font-weight: 700;
        }

        /* Eliminar flechas nativas del input */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body>

    <div class="cotizador-container">
        <h1>COTIZADOR POCAMARKET</h1>
        <div class="subtitulo">pocamarket dubupuff - dólar 1500</div>

        <!-- Único espacio para ingresar monto -->
        <div class="input-group">
            <label for="monto-input">ingresar el monto con punto. ejemplo: 2.50</label>
            <input type="number" id="monto-input" placeholder="0.00" min="0" step="any" autofocus>
        </div>

        <!-- Cuadro de resultados automáticos -->
        <div class="resultados-box">
            <div class="resultado-item">
                <span class="res-label">Si son Dólares (USD):</span>
                <span class="res-value" id="res-a-pesos">$0.00 ARS</span>
            </div>
            <div class="resultado-item">
                <span class="res-label">Si son Pesos (ARS):</span>
                <span class="res-value" id="res-a-dolares">US$ 0.00</span>
            </div>
        </div>
    </div>

    <script>
        const TASA_CAMBIO = 1500;
        const montoInput = document.getElementById('monto-input');
        const resAPesos = document.getElementById('res-a-pesos');
        const resADolares = document.getElementById('res-a-dolares');

        montoInput.addEventListener('input', () => {
            const valor = parseFloat(montoInput.value);
            
            if (!isNaN(valor) && valor > 0) {
                // Cálculo 1: De Dólares a Pesos (Multiplica)
                const aPesos = valor * TASA_CAMBIO;
                // Formateamos el número en estilo argentino (puntos para miles, coma para decimales)
                resAPesos.textContent = '$' + aPesos.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ARS';

                // Cálculo 2: De Pesos a Dólares (Divide)
                const aDolares = valor / TASA_CAMBIO;
                resADolares.textContent = 'US$ ' + aDolares.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            } else {
                // Si está vacío vuelve a cero
                resAPesos.textContent = '$0.00 ARS';
                resADolares.textContent = 'US$ 0.00';
            }
        });
    </script>
</body>
</html>
